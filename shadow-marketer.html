<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW MARKETER | Centro de Comando</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700;800&family=DM+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <style>
        body { font-family: 'Rajdhani', sans-serif; background-color: #050505; color: #e2e8f0; }
        .neon-border { box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); border: 1px solid rgba(139, 92, 246, 0.5); }
        .loader { width: 20px; height: 20px; border: 3px solid #FFF; border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #generator-canvas { display: none; }
        
        /* Checkbox personalizado */
        .custom-checkbox input:checked + div { background-color: #9333ea; border-color: #9333ea; }
        .custom-checkbox input:checked + div:after { content: '✔'; display: flex; align-items: center; justify-content: center; height: 100%; color: white; font-size: 14px; font-weight: bold; }
        
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Ocultar barra de scroll en chips */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen p-6 pb-20">

    <!-- HEADER DE CONTROL -->
    <header class="max-w-7xl mx-auto mb-6 border-b border-gray-800 pb-4 sticky top-0 bg-[#050505]/95 z-40 backdrop-blur-md pt-2">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-500 to-emerald-500 uppercase tracking-widest">
                    SHADOW MARKETER
                </h1>
                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-[0.3em]">Comando Central de Inventario</p>
            </div>
            
            <!-- Buscador y Botón Master -->
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <div class="relative flex-1 md:flex-none">
                    <span class="material-symbols-outlined absolute left-3 top-2.5 text-gray-500 text-sm">search</span>
                    <input type="text" id="search-filter" oninput="applyFilters()" placeholder="Buscar equipo..." 
                        class="bg-gray-900 border border-gray-700 text-white text-sm rounded-lg block w-full pl-10 p-2.5 focus:border-green-500 focus:ring-1 outline-none uppercase font-bold placeholder:normal-case w-64">
                </div>

                <button onclick="selectAllVisible()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded text-xs font-bold uppercase border border-gray-700">
                    ☑️ Todos
                </button>
                
                <button id="btn-nuke" onclick="startBatchGeneration()" class="px-6 py-2 bg-gradient-to-r from-green-600 to-emerald-600 text-white rounded font-black uppercase tracking-widest shadow-lg hover:scale-105 transition-all flex items-center gap-2">
                    <span class="material-symbols-outlined">auto_fix_high</span> 
                    <span id="btn-nuke-text">Generar (0)</span>
                </button>
            </div>
        </div>
        
        <!-- BARRA DE CONFIGURACIÓN DE TARJETAS -->
        <div class="mt-4 bg-gray-900/50 border border-gray-800 rounded-lg p-3 flex flex-wrap items-center gap-x-6 gap-y-3">
            
            <!-- Checkbox IA -->
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-sm text-purple-400">robot_2</span>
                <label class="cursor-pointer flex items-center gap-2 text-xs font-bold text-gray-300">
                    <input type="checkbox" id="cfg-use-ai" checked class="w-4 h-4 accent-purple-500 cursor-pointer">
                    GENERAR TEXTO CON IA (FB/WA)
                </label>
            </div>

            <div class="w-px h-6 bg-gray-700 hidden md:block"></div>

            <!-- Formato -->
            <div class="flex items-center gap-3 text-xs font-bold text-gray-300">
                <span class="material-symbols-outlined text-sm text-blue-400">aspect_ratio</span> FORMATO:
                <label class="cursor-pointer flex items-center gap-1"><input type="radio" name="cfg-format" value="square" checked class="accent-blue-500"> Cuadrado</label>
                <label class="cursor-pointer flex items-center gap-1"><input type="radio" name="cfg-format" value="vertical" class="accent-blue-500"> Móvil</label>
            </div>

            <div class="w-px h-6 bg-gray-700 hidden md:block"></div>

            <!-- Color Base -->
            <div class="flex items-center gap-2 text-xs font-bold text-gray-300">
                <span class="material-symbols-outlined text-sm">palette</span> COLOR PIE:
                <input type="color" id="cfg-color" value="#347a46" class="w-6 h-6 border-none cursor-pointer rounded bg-transparent">
            </div>

            <!-- Campos Textos Extras -->
            <div class="flex-1 flex gap-2 min-w-[300px]">
                <input type="text" id="cfg-warranty" value="Con Factura y Garantía" placeholder="Texto Garantía" class="bg-black border border-gray-700 text-xs px-2 py-1 rounded w-full outline-none focus:border-green-500">
                <input type="text" id="cfg-delivery" value="Mensajería por costo adicional" placeholder="Texto Mensajería" class="bg-black border border-gray-700 text-xs px-2 py-1 rounded w-full outline-none focus:border-green-500">
            </div>
        </div>

        <!-- Filtros Rápidos -->
        <div id="category-chips" class="flex gap-2 mt-4 overflow-x-auto pb-2 scrollbar-hide"></div>
    </header>

    <!-- GRID DE PRODUCTOS -->
    <main class="max-w-7xl mx-auto">
        <!-- RESUMEN MASIVO -->
        <div id="batch-summary-box" class="hidden bg-gray-900 border border-green-500/50 p-6 rounded-xl mb-8 shadow-2xl relative animate-fade-in">
            <h3 class="text-green-400 font-black uppercase tracking-widest mb-2 flex items-center gap-2">
                <span class="material-symbols-outlined">campaign</span> TEXTO PARA REDES SOCIALES
            </h3>
            <textarea id="summary-text-area" class="w-full h-48 bg-black/50 border border-gray-700 text-xs text-white p-4 rounded-lg font-mono resize-none leading-relaxed"></textarea>
            <div class="flex gap-2 mt-2">
                <button onclick="copyToClipboard('summary-text-area', this)" class="bg-green-600 hover:bg-green-500 text-white py-2 px-6 rounded text-xs font-bold uppercase w-full shadow-lg">COPIAR TODO EL TEXTO</button>
            </div>
        </div>

        <div id="war-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
            <div class="col-span-full text-center py-20 opacity-50">
                <span class="loader"></span>
                <p class="mt-4 text-gray-600 uppercase tracking-widest">Cargando base de datos...</p>
            </div>
        </div>
    </main>

    <!-- MODAL IA INDIVIDUAL -->
    <div id="revolico-modal" class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#0a0a0a] w-full max-w-2xl rounded-2xl border border-gray-700 shadow-2xl relative flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-900/50 rounded-t-2xl">
                <div>
                    <h2 class="text-lg font-black text-white uppercase flex items-center gap-2">
                        <span class="text-purple-500 text-xl">R</span> GENERADOR IA
                    </h2>
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest" id="rev-product-name">...</p>
                </div>
                <button onclick="closeRevolico()" class="text-gray-400 hover:text-white"><span class="material-symbols-outlined">close</span></button>
            </div>

            <div class="p-6 overflow-y-auto space-y-4">
                <div id="rev-loader" class="hidden text-center py-10">
                    <span class="loader border-purple-500"></span>
                    <p class="mt-4 text-purple-400 text-xs font-bold uppercase animate-pulse">La IA está redactando...</p>
                </div>

                <div id="rev-content" class="space-y-4 hidden">
                    <div>
                        <div class="flex justify-between items-end mb-1">
                            <label class="text-[10px] font-black text-gray-500 uppercase">Título</label>
                            <button onclick="copyToClipboard('rev-title-input', this)" class="text-[9px] text-purple-400 hover:text-white">Copiar</button>
                        </div>
                        <input type="text" id="rev-title-input" class="w-full bg-black border border-gray-700 rounded-lg p-2 text-white font-bold text-sm outline-none">
                    </div>
                    <div>
                        <div class="flex justify-between items-end mb-1">
                            <label class="text-[10px] font-black text-gray-500 uppercase">Cuerpo del Anuncio</label>
                            <button onclick="copyToClipboard('rev-body-input', this)" class="text-[9px] text-purple-400 hover:text-white">Copiar</button>
                        </div>
                        <textarea id="rev-body-input" class="w-full h-48 bg-black border border-gray-700 rounded-lg p-3 text-gray-300 text-xs font-mono resize-none outline-none"></textarea>
                    </div>
                </div>
            </div>
            
            <div class="p-3 border-t border-gray-800 bg-gray-900/30 rounded-b-2xl flex justify-end">
                <button onclick="regenerateRevolico()" class="text-[10px] font-bold text-gray-400 hover:text-white uppercase flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">refresh</span> Regenerar
                </button>
            </div>
        </div>
    </div>

    <!-- CANVAS OCULTO PARA GENERAR IMÁGENES -->
    <canvas id="generator-canvas"></canvas>

<script>
    // --- CONFIGURACIÓN ---
    const SUPABASE_URL = 'https://ljqwaovevfatkiigirhf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_DAuFcu0JjUo15yLDAev3MQ_9x5GIVXt'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const AGENT_NAME = "Marcel Montano";
    const AGENT_PHONE = "58183649"; 
    const BASE_WEB_URL = "https://paratuhogar.github.io/paratuhogar"; 

    let allProducts = [];
    let filteredProducts = [];
    let selectedIds = new Set();
    let processing = false;
    let currentRevolicoProduct = null;

    // --- INICIO ---
    window.onload = async () => {
        const pass = prompt("🛡️ SALA DE GUERRA\nClave de Mando:");
        if(pass !== "marcel/6") { document.body.innerHTML = "<h1 style='color:red;text-align:center;margin-top:20%'>DENEGADO</h1>"; return; }
        
        if(!localStorage.getItem('pth_gemini_api_key')) {
            const key = prompt("🔑 API Key Gemini (Opcional, pero necesaria para IA):");
            if(key) localStorage.setItem('pth_gemini_api_key', key);
        }
        await loadAllProducts();
    };

    // --- CARGA DE DATOS ---
    async function loadAllProducts() {
        const { data: productos, error } = await supabaseClient
            .from('productos').select('*').eq('disponible', 'SI').order('created_at', { ascending: false });

        if(error) return alert("Error DB: " + error.message);
        allProducts = productos; filteredProducts = productos;
        renderCategories(); renderGrid();
    }

    // --- RENDERIZADO UI ---
    function renderCategories() {
        const cats = [...new Set(allProducts.map(p => p.categoria ? p.categoria.toUpperCase() : 'VARIOS'))].sort();
        const container = document.getElementById('category-chips');
        let html = `<button onclick="filterByCat('TODOS')" class="px-3 py-1 rounded-full bg-gray-800 text-[10px] font-bold text-white hover:bg-green-600 border border-gray-700">TODOS</button>`;
        cats.forEach(c => {
            html += `<button onclick="filterByCat('${c}')" class="px-3 py-1 rounded-full bg-gray-800 text-[10px] font-bold text-gray-400 hover:bg-gray-700 hover:text-white border border-gray-700 whitespace-nowrap">${c}</button>`;
        });
        container.innerHTML = html;
    }

    function filterByCat(cat) {
        document.getElementById('search-filter').value = "";
        filteredProducts = cat === 'TODOS' ? allProducts : allProducts.filter(p => p.categoria && p.categoria.toUpperCase() === cat);
        renderGrid();
    }

    function applyFilters() {
        const term = document.getElementById('search-filter').value.toLowerCase();
        filteredProducts = allProducts.filter(p => p.nombre.toLowerCase().includes(term) || (p.categoria && p.categoria.toLowerCase().includes(term)));
        renderGrid();
    }

    function renderGrid() {
        const grid = document.getElementById('war-grid');
        document.getElementById('btn-nuke-text').innerText = `Generar (${selectedIds.size})`;

        if(filteredProducts.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center py-20 border border-dashed border-gray-800 rounded-xl"><p class="text-gray-500 uppercase">Sin resultados.</p></div>`; return;
        }

        grid.innerHTML = filteredProducts.map(p => {
            const isSel = selectedIds.has(p.id);
            const border = isSel ? 'border-green-500 shadow-[0_0_15px_rgba(34,197,94,0.2)] bg-gray-900' : 'border-gray-800 bg-[#0a0a0a] hover:border-gray-600';
            
            return `
            <div id="card-${p.id}" class="${border} border rounded-xl flex flex-col relative group transition-all overflow-hidden">
                <div class="absolute top-2 left-2 z-20 custom-checkbox">
                    <label class="cursor-pointer relative flex">
                        <input type="checkbox" onchange="toggleSelection('${p.id}')" ${isSel ? 'checked' : ''} class="appearance-none w-6 h-6 border-2 border-gray-500 rounded bg-black/60 checked:bg-green-500 checked:border-green-500 absolute opacity-0 z-20 cursor-pointer">
                        <div class="w-6 h-6 border-2 border-gray-500 rounded bg-black/60 flex items-center justify-center pointer-events-none z-10 backdrop-blur-sm"></div>
                    </label>
                </div>

                <div class="absolute top-2 right-2 z-20 bg-green-600 text-white text-[9px] font-black px-2 py-1 rounded uppercase shadow-md">ParaTuHogar</div>

                <div class="w-full h-48 bg-white/5 flex items-center justify-center p-4 relative cursor-pointer" onclick="toggleSelection('${p.id}')">
                    <img src="${fixDriveUrl(p.thumbnail)}" class="max-w-full max-h-full object-contain drop-shadow-lg" loading="lazy">
                </div>

                <div class="p-4 flex-1 flex flex-col">
                    <h3 class="text-xs font-bold text-white leading-tight line-clamp-2 mb-1" title="${p.nombre}">${p.nombre}</h3>
                    <div class="text-lg font-black text-yellow-500 mt-auto">$${p.precio} USD</div>

                    <div class="flex gap-2 mt-3 pt-3 border-t border-gray-800">
                        <button onclick="openRevolicoModal('${p.id}')" class="w-full bg-purple-900/30 border border-purple-800/50 hover:bg-purple-800 text-purple-400 py-1.5 rounded text-[9px] font-black uppercase transition-all flex items-center justify-center gap-1">
                            <span class="font-serif">R</span> IA Individual
                        </button>
                    </div>

                    <div id="status-${p.id}" class="hidden mt-2 text-center"></div>
                    <div id="result-${p.id}" class="hidden mt-2 pt-2 border-t border-gray-800">
                        <img id="img-result-${p.id}" class="w-full h-auto rounded border border-gray-700 hidden">
                        <textarea id="text-result-${p.id}" class="w-full h-12 bg-black text-[9px] text-gray-400 p-2 rounded mb-1 resize-none border border-gray-800 hidden"></textarea>
                        <div class="flex gap-1">
                            <button onclick="downloadImageById('${p.id}', '${p.nombre}')" class="flex-1 bg-green-700 text-white text-[9px] py-1 rounded font-bold hover:bg-green-600">FOTO</button>
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function toggleSelection(id) {
        selectedIds.has(id) ? selectedIds.delete(id) : selectedIds.add(id);
        renderGrid();
    }

    function selectAllVisible() {
        const allSel = filteredProducts.every(p => selectedIds.has(p.id));
        filteredProducts.forEach(p => allSel ? selectedIds.delete(p.id) : selectedIds.add(p.id));
        renderGrid();
    }

    // --- IA INDIVIDUAL (MODAL) ---
    function openRevolicoModal(id) {
        const p = allProducts.find(x => x.id === id);
        if(!p) return;
        currentRevolicoProduct = p;
        
        document.getElementById('rev-product-name').innerText = p.nombre;
        document.getElementById('rev-loader').classList.remove('hidden');
        document.getElementById('rev-content').classList.add('hidden');
        document.getElementById('revolico-modal').classList.remove('hidden');

        generateRevolicoText(p);
    }
    function closeRevolico() { document.getElementById('revolico-modal').classList.add('hidden'); }
    function regenerateRevolico() { if(currentRevolicoProduct) { document.getElementById('rev-loader').classList.remove('hidden'); document.getElementById('rev-content').classList.add('hidden'); generateRevolicoText(currentRevolicoProduct); } }

    async function generateRevolicoText(p) {
        const apiKey = localStorage.getItem('pth_gemini_api_key');
        if(!apiKey) return alert("Falta API Key de Gemini.");

        const prompt = `Actúa como un experto en ventas para Facebook/Revolico en Cuba.
        PRODUCTO: "${p.nombre}"
        PRECIO: $${p.precio} USD
        DESCRIPCIÓN: "${p.descripcion || 'Garantía y Transporte'}"
        
        Genera un JSON:
        {"titulo": "TÍTULO LLAMATIVO SIN PRECIO", "cuerpo": "Descripción con viñetas, emojis y que es Nuevo en caja. Menciona garantía y mensajería."}
        
        Responde SOLO JSON.`;

        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            const response = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
            if (!response.ok) throw new Error("Error API");
            
            const data = await response.json();
            let rawText = data.candidates[0].content.parts[0].text.trim().replace(/^```json/i, '').replace(/```$/i, '').trim();
            const result = JSON.parse(rawText);

            document.getElementById('rev-title-input').value = result.titulo || p.nombre;
            document.getElementById('rev-body-input').value = result.cuerpo || p.descripcion;
        } catch(e) {
            document.getElementById('rev-title-input').value = `🔥 ${p.nombre} - Nuevo 📦`;
            document.getElementById('rev-body-input').value = `✅ ESTADO: Nuevo en caja\n💲 PRECIO: $${p.precio} USD\n\n🚚 Mensajería Disponible\n📲 Contactar al WhatsApp: +53 ${AGENT_PHONE}`;
        }
        
        document.getElementById('rev-loader').classList.add('hidden');
        document.getElementById('rev-content').classList.remove('hidden');
    }

    // --- GENERACIÓN MASIVA (MOTOR GRÁFICO RECONSTRUIDO) ---
    async function startBatchGeneration() {
        if(selectedIds.size === 0) return alert("Selecciona productos.");
        if(processing) return;
        
        processing = true;
        const btn = document.getElementById('btn-nuke');
        const originalBtn = btn.innerHTML;
        btn.innerHTML = `<span class="loader"></span> GENERANDO...`;

        const useAI = document.getElementById('cfg-use-ai').checked;
        const format = document.querySelector('input[name="cfg-format"]:checked').value;
        const footerColor = document.getElementById('cfg-color').value;
        const warrantyTxt = document.getElementById('cfg-warranty').value;
        const deliveryTxt = document.getElementById('cfg-delivery').value;

        const targets = allProducts.filter(p => selectedIds.has(p.id));
        const zip = new JSZip();
        let summaryContent = `🚨 *¡NUEVO CATÁLOGO DISPONIBLE!* 🚨\nEntrega rápida en La Habana. 🚚💨\n\n`;

        for (const p of targets) {
            const statusDiv = document.getElementById(`status-${p.id}`);
            if(statusDiv) { statusDiv.innerHTML = `<span class="text-[9px] text-blue-400 font-bold">Dibujando...</span>`; statusDiv.classList.remove('hidden'); }

            try {
                const link = await getOrGenerateShortLink(p.nombre);
                
                // 1. DIBUJAR IMAGEN (NUEVO MOTOR)
                const imgBase64 = await drawCardCanvas(p, format, footerColor, warrantyTxt, deliveryTxt);
                
                // 2. IA TEXTO (SI ESTÁ ACTIVO)
                let aiText = "";
                if (useAI) {
                    if(statusDiv) statusDiv.innerHTML = `<span class="text-[9px] text-purple-400 font-bold">IA Pensando...</span>`;
                    aiText = await generateSimpleAI(p);
                } else {
                    aiText = `🔥 *${p.nombre}*\n💰 Precio: *$${p.precio} USD*`;
                }

                // Guardar en ZIP
                const imgData = imgBase64.split(',')[1];
                zip.file(`${p.nombre.replace(/[^a-z0-9]/gi, '_').substring(0, 40)}.jpg`, imgData, {base64: true});

                // Update UI
                const resDiv = document.getElementById(`result-${p.id}`);
                const imgEl = document.getElementById(`img-result-${p.id}`);
                const txtEl = document.getElementById(`text-result-${p.id}`);
                
                if(resDiv) {
                    imgEl.src = imgBase64; imgEl.classList.remove('hidden');
                    if(useAI) { txtEl.value = `${aiText}\n\n🔗 Detalles: ${link}\n📲 WhatsApp: +53 ${AGENT_PHONE}`; txtEl.classList.remove('hidden'); }
                    resDiv.classList.remove('hidden');
                }

                summaryContent += `✅ *${p.nombre}*\n💰 $${p.precio} USD\n🔗 ${link}\n➖➖➖➖➖\n`;
                if(statusDiv) statusDiv.innerHTML = `<span class="text-[9px] text-green-500 font-bold">✅ LISTO</span>`;

            } catch(e) { console.error(e); }
            await new Promise(r => setTimeout(r, 300));
        }

        if(useAI) {
            summaryContent += `\n📲 *Haz tu pedido:* https://wa.me/53${AGENT_PHONE}`;
            document.getElementById('summary-text-area').value = summaryContent;
            document.getElementById('batch-summary-box').classList.remove('hidden');
        }

        btn.innerHTML = `📦 ZIP...`;
        try {
            const content = await zip.generateAsync({type:"blob"});
            saveAs(content, `Catalogo_${new Date().toLocaleDateString().replace(/\//g,'-')}.zip`);
        } catch(e) {}

        btn.innerHTML = originalBtn;
        processing = false;
    }

    // --- NUEVO MOTOR GRÁFICO (Clon exacto de tu popup.js) ---
    async function drawCardCanvas(p, format, color, warrantyTxt, deliveryTxt) {
        const canvas = document.getElementById('generator-canvas');
        const ctx = canvas.getContext('2d');
        const isSquare = (format === 'square');
        
        const cW = isSquare ? 1080 : 720;
        const cH = isSquare ? 1080 : 1280;
        const s = isSquare ? 50 : 40; 
        
        canvas.width = cW; canvas.height = cH;
        const ff = "'DM Sans', sans-serif";

        // Fondo Blanco
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cW, cH);

        // Cargar Imagen del producto
        const img = new Image(); 
        img.crossOrigin = "Anonymous"; 
        img.src = fixDriveUrl(p.thumbnail);
        await new Promise((r) => { img.onload = r; img.onerror = r; }); // Esperar carga

        if (!isSquare) {
            // --- FORMATO VERTICAL (Historias) ---
            ctx.fillStyle = '#f8f8f8'; ctx.fillRect(0, 0, cW, 70);
            ctx.fillStyle = '#111'; ctx.font = `800 24px ${ff}`; ctx.textBaseline = 'middle';
            ctx.fillText((p.categoria || 'PRODUCTO').toUpperCase(), s, 35);

            const imgTop = 70, imgH = 680, imgW = cW - s * 2;
            ctx.fillStyle = '#f4f4f4'; ctx.fillRect(0, imgTop, cW, imgH);
            
            if (img.width) {
                const r = Math.min(imgW / img.width, (imgH - 40) / img.height);
                const iw = img.width * r, ih = img.height * r;
                ctx.drawImage(img, s + (imgW - iw) / 2, imgTop + 20 + (imgH - 40 - ih) / 2, iw, ih);
            }

            // Badge
            ctx.font = `800 18px ${ff}`;
            const bw = ctx.measureText('AGOTÁNDOSE').width + 30;
            ctx.fillStyle = '#e07b00'; roundRect(ctx, cW - s - bw, imgTop + 20, bw, 36, 6);
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText('AGOTÁNDOSE', cW - s - bw/2, imgTop + 38);
            ctx.textAlign = 'left';

            const sepY = imgTop + imgH + 20;
            ctx.textBaseline = 'top'; ctx.fillStyle = '#111'; ctx.font = `800 32px ${ff}`;
            let curY = sepY;
            
            wrapText(ctx, p.nombre, cW - s * 2).slice(0, 2).forEach(l => { ctx.fillText(l, s, curY); curY += 38; });
            curY += 10;

            // Precio
            ctx.font = `900 85px ${ff}`; ctx.fillStyle = '#111'; 
            ctx.fillText(`${p.precio} USD`, s, curY);
            curY += 100;

            // Detalles
            ctx.font = `600 20px ${ff}`; ctx.fillStyle = '#555';
            ctx.fillText(`🛡️ Garantía: ${warrantyTxt}`, s, curY); curY += 30;
            ctx.fillText(`🚚 ${deliveryTxt}`, s, curY);

            // Footer
            const banH = 160, banY = cH - banH;
            ctx.fillStyle = color; ctx.fillRect(0, banY, cW, banH);
            
            ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle';
            ctx.font = `800 38px ${ff}`;
            ctx.fillText(`+53 ${AGENT_PHONE}`, s, banY + banH * 0.4);
            ctx.font = `600 22px ${ff}`; ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fillText("¡Escríbeme por WhatsApp!", s, banY + banH * 0.7);

        } else {
            // --- FORMATO CUADRADO (Facebook) ---
            ctx.fillStyle = '#f8f8f8'; ctx.fillRect(0, 0, cW, 85);
            ctx.fillStyle = '#111'; ctx.font = `900 32px ${ff}`; ctx.textBaseline = 'middle';
            ctx.fillText((p.categoria || 'PRODUCTO').toUpperCase(), s, 42);

            const imgTop = 85, imgH = 650, imgW = cW - s * 2;
            ctx.fillStyle = '#f4f4f4'; ctx.fillRect(0, imgTop, cW, imgH);

            if (img.width) {
                const r = Math.min(imgW / img.width, (imgH-40) / img.height);
                const iw = img.width * r, ih = img.height * r;
                ctx.drawImage(img, s + (imgW - iw) / 2, imgTop + 20 + (imgH - 40 - ih) / 2, iw, ih);
            }

            // Badge
            ctx.font = `800 20px ${ff}`;
            const bw = ctx.measureText('AGOTÁNDOSE').width + 36;
            ctx.fillStyle = '#e07b00'; roundRect(ctx, cW - s - bw, imgTop + 25, bw, 40, 6);
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText('AGOTÁNDOSE', cW - s - bw/2, imgTop + 45);
            ctx.textAlign = 'left';

            const sepY = imgTop + imgH + 20;
            let curY = sepY;

            // Precio (Derecha)
            ctx.textAlign = 'right'; ctx.textBaseline = 'top';
            ctx.font = `900 100px ${ff}`; ctx.fillStyle = '#111';
            ctx.fillText(`${p.precio} USD`, cW - s, curY);
            ctx.textAlign = 'left';

            // Título (Izquierda)
            ctx.fillStyle = '#111'; ctx.font = `800 36px ${ff}`;
            const maxW = cW - s * 2 - 450; // Dejar espacio para precio
            wrapText(ctx, p.nombre, maxW).slice(0, 2).forEach(l => { ctx.fillText(l, s, curY); curY += 42; });
            
            curY += 15;
            ctx.font = `600 22px ${ff}`; ctx.fillStyle = '#555';
            ctx.fillText(`🛡️ Garantía: ${warrantyTxt}`, s, curY); curY += 32;
            ctx.fillText(`🚚 ${deliveryTxt}`, s, curY);

            // Footer
            const banH = 120, banY = cH - banH;
            ctx.fillStyle = color; ctx.fillRect(0, banY, cW, banH);
            
            ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle';
            
            // Teléfono Izquierda
            const isz = 54, iy = banY + (banH - isz) / 2;
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath(); ctx.arc(s + isz / 2, iy + isz / 2, isz / 2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = `${isz * 0.6}px serif`; ctx.textAlign = 'center';
            ctx.fillText('✆', s + isz / 2, iy + isz / 2 + 2);
            
            ctx.textAlign = 'left'; ctx.font = `800 42px ${ff}`;
            ctx.fillText(`+53 ${AGENT_PHONE}`, s + isz + 15, banY + banH / 2);

            // CTA Derecha
            ctx.textAlign = 'right'; ctx.font = `800 36px ${ff}`;
            ctx.fillText("¡Whastapp!", cW - s, banY + banH / 2);
            ctx.textAlign = 'left';
        }

        return canvas.toDataURL('image/jpeg', 0.95);
    }

    // Funciones Canvas Auxiliares
    function wrapText(ctx, text, maxW) {
        const words = (text||'').split(' '), lines = []; let line = '';
        for (const w of words) {
            const t = line + (line ? ' ' : '') + w;
            if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
        }
        if (line) lines.push(line);
        return lines;
    }
    function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath(); ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
        ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h); ctx.lineTo(x+r, y+h);
        ctx.quadraticCurveTo(x, y+h, x, y+h-r); ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
        ctx.closePath(); ctx.fill();
    }

    // --- IA CORTA PARA BATCH ---
    async function generateSimpleAI(p) {
        const apiKey = localStorage.getItem('pth_gemini_api_key');
        if(!apiKey) return `🔥 *${p.nombre}*\n💰 *$${p.precio} USD*`;

        const prompt = `Escribe un anuncio MUY CORTO (máximo 3 líneas) para vender este producto en WhatsApp.
        Producto: ${p.nombre}. Precio: $${p.precio}. Incluye un par de emojis. Sin hashtags.`;

        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const d = await r.json();
            return d.candidates[0].content.parts[0].text.trim();
        } catch(e) { return `🔥 *${p.nombre}*\n💰 Precio: *$${p.precio} USD*`; }
    }

    // --- UTILIDADES ---
    function fixDriveUrl(url) {
        if (!url || url === 'null' || url.trim() === '') return 'https://placehold.co/400x400/f4f4f4/cccccc?text=Sin+Foto';
        let n = url.includes('/') ? url.split('/').pop() : url;
        n = n.split('?')[0].trim().replace(/['"]/g, '').replace(/\s+/g, '');
        return `https://raw.githubusercontent.com/paratuhogar/paratuhogar-fotos/main/img_productos/${n}`;
    }

    async function getOrGenerateShortLink(name) {
        const c = encodeURIComponent(name.trim());
        const l = `${BASE_WEB_URL}/index.html?search=${c}&gestor=${encodeURIComponent(AGENT_NAME)}&tel=${AGENT_PHONE}`;
        try {
            const { data } = await supabaseClient.from('short_links').select('slug').eq('original_url', l).maybeSingle();
            if (data && data.slug) return `${BASE_WEB_URL}/index.html?s=${data.slug}`;
            const s = Math.random().toString(36).substring(2, 7);
            await supabaseClient.from('short_links').insert([{ slug: s, original_url: l, gestor: AGENT_NAME }]);
            return `${BASE_WEB_URL}/index.html?s=${s}`;
        } catch (e) { return l; }
    }

    function copyToClipboard(id, btn) {
        const el = document.getElementById(id); el.select(); document.execCommand('copy');
        const orig = btn.innerText; btn.innerText = "¡COPIADO!";
        setTimeout(() => { btn.innerText = orig; }, 2000);
    }
    function downloadImageById(id, name) {
        const img = document.getElementById(`img-result-${id}`);
        if(img) { const a = document.createElement('a'); a.href = img.src; a.download = `Post_${name.replace(/\s+/g, '_')}.jpg`; a.click(); }
    }
