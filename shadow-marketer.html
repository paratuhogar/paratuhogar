<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW MARKETER | Centro de Comando</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <style>
        body { font-family: 'Rajdhani', sans-serif; background-color: #050505; color: #e2e8f0; }
        .neon-border { box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); border: 1px solid rgba(139, 92, 246, 0.5); }
        .loader { width: 24px; height: 24px; border: 3px solid #FFF; border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #generator-canvas { display: none; }
        
        /* Checkbox personalizado */
        .custom-checkbox input:checked + div { background-color: #7c3aed; border-color: #7c3aed; }
        .custom-checkbox input:checked + div:after { content: '✔'; display: block; text-align: center; color: white; font-size: 12px; }
    </style>
</head>
<body class="min-h-screen p-6 pb-20">

    <!-- HEADER DE CONTROL -->
    <header class="max-w-7xl mx-auto mb-8 border-b border-gray-800 pb-6 sticky top-0 bg-[#050505]/95 z-40 backdrop-blur-md pt-2">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-500 to-indigo-500 uppercase tracking-widest">
                    SHADOW MARKETER
                </h1>
                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-[0.3em]">Comando Central de Inventario</p>
            </div>
            
            <!-- BARRA DE HERRAMIENTAS -->
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <!-- Buscador -->
                <div class="relative flex-1 md:flex-none">
                    <span class="material-symbols-outlined absolute left-3 top-2.5 text-gray-500 text-sm">search</span>
                    <input type="text" id="search-filter" oninput="applyFilters()" placeholder="Buscar equipo..." 
                        class="bg-gray-900 border border-gray-700 text-white text-sm rounded-lg block w-full pl-10 p-2.5 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none uppercase font-bold placeholder:normal-case">
                </div>

                <!-- Botones de Acción -->
                <button onclick="selectAllVisible()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded text-xs font-bold uppercase tracking-wider transition-all border border-gray-700">
                    ☑️ Todos
                </button>
                
                <button id="btn-nuke" onclick="startBatchGeneration()" class="px-6 py-2 bg-gradient-to-r from-purple-700 to-indigo-600 text-white rounded font-black uppercase tracking-widest shadow-lg shadow-purple-900/50 hover:scale-105 transition-all flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span class="material-symbols-outlined">auto_fix_high</span> 
                    <span id="btn-nuke-text">Generar (0)</span>
                </button>
            </div>
        </div>
        
        <!-- Filtros Rápidos -->
        <div id="category-chips" class="flex gap-2 mt-4 overflow-x-auto pb-2 scrollbar-hide">
            <!-- Se llena con JS -->
        </div>
    </header>

    <!-- GRID DE PRODUCTOS -->
    <main class="max-w-7xl mx-auto">
        <div id="status-bar" class="mb-4 text-sm text-gray-400 font-mono hidden"></div>
        
        <!-- RESUMEN MASIVO (Aparece al generar) -->
        <div id="batch-summary-box" class="hidden bg-gray-900 border border-indigo-500/50 p-6 rounded-xl mb-8 shadow-2xl relative animate-fade-in">
            <h3 class="text-indigo-400 font-black uppercase tracking-widest mb-2 flex items-center gap-2">
                <span class="material-symbols-outlined">campaign</span> POST DE LANZAMIENTO (SELECCIÓN)
            </h3>
            <textarea id="summary-text-area" class="w-full h-48 bg-black/50 border border-gray-700 text-xs text-green-400 p-4 rounded-lg font-mono resize-none leading-relaxed"></textarea>
            <div class="flex gap-2 mt-2">
                <button onclick="copyToClipboard('summary-text-area', this)" class="bg-indigo-600 hover:bg-indigo-500 text-white py-2 px-6 rounded text-xs font-bold uppercase w-full shadow-lg">COPIAR TEXTO AGRUPADO</button>
            </div>
        </div>

        <div id="war-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <div class="col-span-full text-center py-20 opacity-50">
                <span class="loader"></span>
                <p class="mt-4 text-gray-600 uppercase tracking-widest">Cargando la base de datos...</p>
            </div>
        </div>
    </main>

    <!-- MODAL REVOLICO -->
    <div id="revolico-modal" class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#0a0a0a] w-full max-w-2xl rounded-2xl border border-gray-700 shadow-2xl relative flex flex-col max-h-[90vh]">
            
            <!-- Header Modal -->
            <div class="p-6 border-b border-gray-800 flex justify-between items-center bg-gray-900/50 rounded-t-2xl">
                <div>
                    <h2 class="text-xl font-black text-white uppercase flex items-center gap-2">
                        <span class="text-blue-500 text-2xl">R</span> GENERADOR REVOLICO
                    </h2>
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest" id="rev-product-name">...</p>
                </div>
                <button onclick="closeRevolico()" class="text-gray-400 hover:text-white"><span class="material-symbols-outlined">close</span></button>
            </div>

            <!-- Body Modal -->
            <div class="p-6 overflow-y-auto space-y-6">
                
                <!-- Estado Carga -->
                <div id="rev-loader" class="hidden text-center py-10">
                    <span class="loader border-blue-500"></span>
                    <p class="mt-4 text-blue-400 text-xs font-bold uppercase animate-pulse">La IA está redactando el anuncio...</p>
                </div>

                <!-- Contenido Generado -->
                <div id="rev-content" class="space-y-6">
                    <!-- Título -->
                    <div>
                        <div class="flex justify-between items-end mb-2">
                            <label class="text-[10px] font-black text-gray-500 uppercase">1. Título para el Anuncio</label>
                            <button onclick="copyToClipboard('rev-title-input', this)" class="text-[9px] bg-blue-900/30 text-blue-400 px-2 py-1 rounded border border-blue-800 hover:bg-blue-800 hover:text-white transition-all font-bold uppercase">Copiar Título</button>
                        </div>
                        <input type="text" id="rev-title-input" class="w-full bg-black border border-gray-700 rounded-lg p-3 text-white font-bold text-sm focus:border-blue-500 outline-none">
                    </div>

                    <!-- Cuerpo -->
                    <div>
                        <div class="flex justify-between items-end mb-2">
                            <label class="text-[10px] font-black text-gray-500 uppercase">2. Descripción / Cuerpo</label>
                            <button onclick="copyToClipboard('rev-body-input', this)" class="text-[9px] bg-blue-900/30 text-blue-400 px-2 py-1 rounded border border-blue-800 hover:bg-blue-800 hover:text-white transition-all font-bold uppercase">Copiar Cuerpo</button>
                        </div>
                        <textarea id="rev-body-input" class="w-full h-64 bg-black border border-gray-700 rounded-lg p-4 text-gray-300 text-sm font-mono leading-relaxed resize-none focus:border-blue-500 outline-none"></textarea>
                    </div>
                </div>
            </div>

            <!-- Footer Modal -->
            <div class="p-4 border-t border-gray-800 bg-gray-900/30 rounded-b-2xl flex justify-end">
                <button onclick="regenerateRevolico()" class="text-xs font-bold text-gray-400 hover:text-white uppercase flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">refresh</span> Regenerar
                </button>
            </div>
        </div>
    </div>

    <!-- CANVAS OCULTO -->
    <canvas id="generator-canvas" width="1080" height="1080"></canvas>

<script>
    // --- 1. CONFIGURACIÓN ---
    const SUPABASE_URL = 'https://ljqwaovevfatkiigirhf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_DAuFcu0JjUo15yLDAev3MQ_9x5GIVXt'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // DATOS GLOBALES
    const AGENT_NAME = "Marcel Montano";
    const AGENT_PHONE = "58183649"; 
    const BASE_WEB_URL = "https://paratuhogar.github.io/paratuhogar"; 

    let allProducts = [];      // Todos los productos cargados
    let filteredProducts = []; // Los que se ven en pantalla
    let selectedIds = new Set(); // IDs seleccionados con checkbox
    let processing = false;
    let currentRevolicoProduct = null; // Producto actual en el modal

    // --- 2. INICIO ---
    window.onload = async () => {
        // Validación de Seguridad Simple
        const pass = prompt("🛡️ SALA DE GUERRA\nClave de Mando:");
        if(pass !== "marcel/6") { 
            document.body.innerHTML = "<h1 style='color:red;text-align:center;margin-top:20%;font-family:sans-serif'>ACCESO DENEGADO</h1>";
            return;
        }
        
        // API Key IA
        if(!localStorage.getItem('pth_gemini_api_key')) {
            const key = prompt("🔑 API Key Gemini (Necesaria para Revolico):");
            if(key) localStorage.setItem('pth_gemini_api_key', key);
        }

        await loadAllProducts();
    };

    // --- 3. CARGA DE DATOS ---
    async function loadAllProducts() {
        const grid = document.getElementById('war-grid');
        
        // Cargar TODO el inventario disponible
        const { data: productos, error } = await supabaseClient
            .from('productos')
            .select('*')
            .eq('disponible', 'SI') // Solo lo que hay en stock
            .order('created_at', { ascending: false });

        if(error) return alert("Error DB: " + error.message);

        allProducts = productos;
        filteredProducts = productos; // Al inicio mostramos todo
        
        renderCategories();
        renderGrid();
    }

    // --- 4. RENDERIZADO UI ---
    function renderCategories() {
        const cats = [...new Set(allProducts.map(p => p.categoria ? p.categoria.toUpperCase() : 'VARIOS'))].sort();
        const container = document.getElementById('category-chips');
        
        let html = `<button onclick="filterByCat('TODOS')" class="px-3 py-1 rounded-full bg-gray-800 text-[10px] font-bold text-white hover:bg-purple-600 transition-colors border border-gray-700">TODOS</button>`;
        
        cats.forEach(c => {
            html += `<button onclick="filterByCat('${c}')" class="px-3 py-1 rounded-full bg-gray-800 text-[10px] font-bold text-gray-400 hover:bg-gray-700 hover:text-white transition-colors border border-gray-700 whitespace-nowrap">${c}</button>`;
        });
        
        container.innerHTML = html;
    }

    function filterByCat(cat) {
        document.getElementById('search-filter').value = ""; // Limpiar buscador
        if(cat === 'TODOS') {
            filteredProducts = allProducts;
        } else {
            filteredProducts = allProducts.filter(p => p.categoria && p.categoria.toUpperCase() === cat);
        }
        renderGrid();
    }

    function applyFilters() {
        const term = document.getElementById('search-filter').value.toLowerCase();
        filteredProducts = allProducts.filter(p => 
            p.nombre.toLowerCase().includes(term) || 
            (p.categoria && p.categoria.toLowerCase().includes(term))
        );
        renderGrid();
    }

    function renderGrid() {
        const grid = document.getElementById('war-grid');
        const btnText = document.getElementById('btn-nuke-text');
        
        // Actualizar contador del botón maestro
        btnText.innerText = `Generar (${selectedIds.size})`;

        if(filteredProducts.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center py-20 border border-dashed border-gray-800 rounded-xl"><p class="text-gray-500 uppercase">No hay productos.</p></div>`;
            return;
        }

        let cardsHTML = filteredProducts.map((p, index) => {
            const isSelected = selectedIds.has(p.id);
            const cardBorder = isSelected ? 'border-purple-500 shadow-purple-900/20 shadow-lg bg-gray-900' : 'border-gray-800 bg-[#0a0a0a]';
            
            return `
            <div id="card-${p.id}" class="${cardBorder} border p-4 rounded-xl flex flex-col relative group transition-all duration-300">
                
                <!-- CHECKBOX SELECCIÓN -->
                <div class="absolute top-3 left-3 z-10 custom-checkbox">
                    <label class="cursor-pointer relative">
                        <input type="checkbox" onchange="toggleSelection('${p.id}')" ${isSelected ? 'checked' : ''} class="appearance-none w-5 h-5 border-2 border-gray-600 rounded bg-black/50 checked:bg-purple-600 checked:border-purple-600 transition-all absolute opacity-0">
                        <div class="w-6 h-6 border-2 border-gray-600 rounded bg-black/50 flex items-center justify-center transition-colors"></div>
                    </label>
                </div>

                <!-- CONTENIDO -->
                <div class="flex gap-4 items-start">
                    <div class="w-20 h-20 shrink-0 bg-gray-900 rounded-lg flex items-center justify-center p-1 border border-gray-800">
                        <img src="${fixDriveUrl(p.thumbnail)}" class="w-full h-full object-contain">
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="text-sm font-black text-white uppercase leading-tight truncate-2-lines h-9 mb-1" title="${p.nombre}">${p.nombre}</h3>
                        <p class="text-xs text-yellow-500 font-bold">$${p.precio} USD</p>
                    </div>
                </div>

                <!-- BOTONES DE ACCIÓN INDIVIDUAL -->
                <div class="flex gap-2 mt-4 pt-4 border-t border-gray-800">
                    <button onclick="openRevolicoModal('${p.id}')" class="flex-1 flex items-center justify-center gap-1 bg-blue-900/20 text-blue-400 border border-blue-900/50 hover:bg-blue-900/40 py-2 rounded text-[10px] font-bold uppercase transition-all">
                        <span class="text-lg font-serif font-black">R</span> Revolico
                    </button>
                    <!-- Estado de generación -->
                    <div id="status-${p.id}" class="hidden"></div>
                </div>

                <!-- RESULTADO GENERACIÓN (Oculto al inicio) -->
                <div id="result-${p.id}" class="hidden mt-4 pt-2 border-t border-gray-800 animate-fade-in">
                    <img id="img-result-${p.id}" class="w-full h-auto rounded mb-2 border border-gray-700">
                    <textarea id="text-result-${p.id}" class="w-full h-20 bg-black text-[10px] text-gray-400 p-2 rounded mb-1"></textarea>
                    <div class="flex gap-1">
                        <button onclick="copyToClipboard('text-result-${p.id}', this)" class="flex-1 bg-gray-800 text-white text-[9px] py-1 rounded font-bold hover:bg-gray-700">COPIAR</button>
                        <button onclick="downloadImageById('${p.id}', '${p.nombre}')" class="px-2 bg-gray-800 text-white rounded hover:bg-gray-700"><span class="material-symbols-outlined text-sm">download</span></button>
                    </div>
                </div>

            </div>`;
        }).join('');

        grid.innerHTML = cardsHTML;
    }

    // --- 5. LÓGICA DE SELECCIÓN ---
    function toggleSelection(id) {
        if(selectedIds.has(id)) {
            selectedIds.delete(id);
        } else {
            selectedIds.add(id);
        }
        renderGrid(); // Re-renderizar para actualizar estilos y contador
    }

    function selectAllVisible() {
        const allSelected = filteredProducts.every(p => selectedIds.has(p.id));
        
        if(allSelected) {
            // Deseleccionar solo los visibles
            filteredProducts.forEach(p => selectedIds.delete(p.id));
        } else {
            // Seleccionar todos los visibles
            filteredProducts.forEach(p => selectedIds.add(p.id));
        }
        renderGrid();
    }

    // --- 6. MÓDULO REVOLICO (MODAL & IA) ---
    function openRevolicoModal(id) {
        const p = allProducts.find(x => x.id === id);
        if(!p) return;

        currentRevolicoProduct = p;
        
        // Reset Modal
        document.getElementById('rev-product-name').innerText = p.nombre;
        document.getElementById('rev-loader').classList.remove('hidden');
        document.getElementById('rev-content').classList.add('hidden');
        document.getElementById('revolico-modal').classList.remove('hidden');

        // Llamar a la IA
        generateRevolicoText(p);
    }

    function closeRevolico() {
        document.getElementById('revolico-modal').classList.add('hidden');
    }

    function regenerateRevolico() {
        if(currentRevolicoProduct) generateRevolicoText(currentRevolicoProduct);
    }

    // --- PEGAR ESTO EN shadow-marketer.html (Reemplaza la función generateRevolicoText anterior) ---
    async function generateRevolicoText(p) {
        const apiKey = localStorage.getItem('pth_gemini_api_key');
        if(!apiKey) return alert("Falta API Key de Gemini. Refresca e ingrésala.");

        const prompt = `Actúa como un vendedor experto en Revolico (Cuba).
        PRODUCTO: "${p.nombre}"
        PRECIO: $${p.precio} USD
        DESCRIPCIÓN: "${p.descripcion || 'Garantía y Transporte incluído'}"
        
        TAREA: Genera un JSON con:
        1. "titulo": Llamativo, corto, emojis al inicio y fin. SIN PRECIO.
        2. "cuerpo": Descripción vendedora con listas y emojis.
        
        Responde SOLO el JSON.`;

        try {
            // Usamos 'gemini-pro' que es más robusto para texto o 'gemini-1.5-flash'
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview-latest:generateContent?key=${apiKey}`;


            const response = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            if (!response.ok) throw new Error(`Error API: ${response.status}`);

            const data = await response.json();
            
            // Validación de seguridad para evitar pantalla blanca
            if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                throw new Error("La IA no devolvió resultados válidos.");
            }

            const rawText = data.candidates[0].content.parts[0].text;
            const jsonStr = rawText.replace(/```json|```/g, '').trim();
            const result = JSON.parse(jsonStr);

            // Rellenar Modal
            document.getElementById('rev-title-input').value = result.titulo || p.nombre;
            document.getElementById('rev-body-input').value = result.cuerpo || p.descripcion;

            // Mostrar
            document.getElementById('rev-loader').classList.add('hidden');
            document.getElementById('rev-content').classList.remove('hidden');

        } catch(e) {
        console.error("Detalle del Error:", e);
        // alert("⚠️ La IA falló. Se cargaron los datos básicos.\n\nCausa: " + e.message);
        
        // --- LIMPIEZA DE HTML (TEXTO DE RESCATE) ---
        let rawHtml = p.descripcion || "";

        // 1. Convertir saltos de línea y viñetas HTML a texto normal
        let descFormateada = rawHtml
            .replace(/<br\s*\/?>/gi, "\n")       // <br> a Salto de línea
            .replace(/<\/p>/gi, "\n\n")          // Fin de párrafo a Doble Salto
            .replace(/<\/div>/gi, "\n")          // Fin de div a Salto
            .replace(/<li>/gi, "• ")             // <li> a viñeta
            .replace(/<\/li>/gi, "\n")           // Fin de lista a Salto
            .replace(/&nbsp;/g, " ");            // Espacios raros a espacio normal

        // 2. Eliminar cualquier otra etiqueta HTML sobrante (strip tags)
        const tempDiv = document.createElement("div");
        tempDiv.innerHTML = descFormateada;
        const textoLimpio = tempDiv.textContent || tempDiv.innerText || "";

        // --- LLENAR CAMPOS CON TEXTO LIMPIO ---
        document.getElementById('rev-title-input').value = `🔥 ${p.nombre} - Nuevo en Caja 📦`;
        
        // Cuerpo del anuncio limpio
        document.getElementById('rev-body-input').value = 
`✅ ESTADO: Nuevo en caja
💲 PRECIO: $${p.precio} USD

📝 DETALLES:
${textoLimpio.trim()}

-----------------------------
🚚 Transporte Disponible
📲 Contactar al WhatsApp: +53 ${AGENT_PHONE}`;
        
        document.getElementById('rev-loader').classList.add('hidden');
        document.getElementById('rev-content').classList.remove('hidden');
    }
    }

    // --- 7. GENERACIÓN MASIVA (IMAGEN + POST FB) ---
    async function startBatchGeneration() {
        if(selectedIds.size === 0) return alert("Selecciona al menos un producto.");
        if(processing) return;
        
        processing = true;
        const btn = document.getElementById('btn-nuke');
        const originalBtnText = btn.innerHTML;
        btn.innerHTML = `<span class="loader"></span> TRABAJANDO...`;

        // 1. Filtrar solo los seleccionados
        const targets = allProducts.filter(p => selectedIds.has(p.id));
        
        // 2. Preparar ZIP y Texto Resumen
        const zip = new JSZip(); // Iniciamos el ZIP
        let summaryContent = `🚨 *¡OFERTAS DISPONIBLES!* 🚨\n\n`;
        summaryContent += `Selección especial de hoy. Entrega rápida en La Habana. 🚚💨\n\n`;

        // 3. Procesar uno a uno
        for (const p of targets) {
            // UI Update
            const statusDiv = document.getElementById(`status-${p.id}`);
            if(statusDiv) {
                statusDiv.innerHTML = `<span class="text-xs text-blue-400 font-bold animate-pulse">Procesando...</span>`;
                statusDiv.classList.remove('hidden');
            }

            try {
                // Generar Link
                const link = await getOrGenerateShortLink(p.nombre);
                
                // Generar Imagen y Texto
                const [imgBase64, aiText] = await Promise.all([
                    generateAdImage(p),
                    generateAdCopy(p)
                ]);

                // AÑADIR AL ZIP (Truco: quitamos la cabecera data:image/jpeg;base64,)
                const imgData = imgBase64.split(',')[1];
                const cleanName = p.nombre.replace(/[^a-z0-9]/gi, '_').substring(0, 50);
                zip.file(`${cleanName}.jpg`, imgData, {base64: true});

                // Mostrar en tarjeta
                const imgEl = document.getElementById(`img-result-${p.id}`);
                const txtEl = document.getElementById(`text-result-${p.id}`);
                
                if(imgEl && txtEl) {
                    imgEl.src = imgBase64;
                    const finalText = `${aiText}\n\n🔗 Ver detalles: ${link}\n📲 Pedidos: +53 ${AGENT_PHONE}`;
                    txtEl.value = finalText;
                    document.getElementById(`result-${p.id}`).classList.remove('hidden');
                }

                // Agregar al resumen de texto
                summaryContent += `✅ *${p.nombre}*\n💰 $${p.precio} USD\n🔗 ${link}\n➖➖➖➖➖\n`;

                if(statusDiv) statusDiv.innerHTML = `<span class="text-xs text-green-500 font-bold">✅ LISTO</span>`;

            } catch(e) {
                console.error(e);
            }
            await new Promise(r => setTimeout(r, 500)); // Pequeña pausa
        }

        // Finalizar Resumen Texto
        summaryContent += `\n📲 *Pedir aquí:* https://wa.me/${AGENT_PHONE}`;
        document.getElementById('summary-text-area').value = summaryContent;
        document.getElementById('batch-summary-box').classList.remove('hidden');

        // --- DESCARGAR ZIP FINAL ---
        btn.innerHTML = `📦 COMPRIMIENDO ZIP...`;
        try {
            const content = await zip.generateAsync({type:"blob"});
            saveAs(content, `Pack_Ofertas_${new Date().toLocaleDateString().replace(/\//g,'-')}.zip`);
            alert("✅ ¡Proceso terminado! Las fotos se han descargado en un ZIP.");
        } catch(e) {
            console.error("Error ZIP:", e);
            alert("Error generando el ZIP, pero las imágenes están en pantalla.");
        }

        btn.innerHTML = originalBtnText; // Restaurar botón
        processing = false;
    }

    // --- 8. FUNCIONES AUXILIARES (GRÁFICA Y TEXTO) ---
    
    // (Mismo motor gráfico que tenías, adaptado a GitHub)
    // --- PEGAR ESTO EN shadow-marketer.html (Reemplaza la función generateAdImage anterior) ---
    async function generateAdImage(p) {
        const canvas = document.getElementById('generator-canvas');
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;

        // Fondo
        const gradient = ctx.createLinearGradient(0, 0, 0, h);
        gradient.addColorStop(0, '#0f172a'); gradient.addColorStop(1, '#1e1b4b'); 
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, w, h);

        // Grilla
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)'; ctx.lineWidth = 1;
        for(let i=0; i<w; i+=60) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,h); ctx.stroke(); }
        for(let i=0; i<h; i+=60) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(w,i); ctx.stroke(); }

        // Texto Título
        ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff'; ctx.font = '800 60px Rajdhani';
        
        // Envolver titulo
        const words = p.nombre.split(' ');
        let line = ''; let yText = 100;
        if (words.length > 5) yText = 80;

        for(let n = 0; n < words.length; n++) {
            const testLine = line + words[n] + ' ';
            if (ctx.measureText(testLine).width > w - 100 && n > 0) {
                ctx.fillText(line, w/2, yText); line = words[n] + ' '; yText += 70;
            } else { line = testLine; }
        }
        ctx.fillText(line, w/2, yText);

        // Imagen
        const img = new Image(); 
        img.crossOrigin = "Anonymous"; 
        img.src = fixDriveUrl(p.thumbnail);
        
        try {
            await new Promise((r, j) => { img.onload = r; img.onerror = j; });
            
            // Ajustar imagen en el centro
            const imgAreaY = yText + 50; 
            const imgAreaH = 880 - imgAreaY; 
            
            const scale = Math.min((w - 100) / img.width, imgAreaH / img.height);
            const iw = img.width * scale; 
            const ih = img.height * scale;
            const ix = (w - iw) / 2; 
            const iy = imgAreaY + (imgAreaH - ih) / 2;

            // Marco blanco tipo sticker
            ctx.fillStyle = 'white'; 
            ctx.beginPath(); 
            ctx.roundRect(ix - 15, iy - 15, iw + 30, ih + 30, 20); 
            ctx.fill();
            
            ctx.drawImage(img, ix, iy, iw, ih);
        } catch(e) {}

        // --- CORRECCIÓN DEL PRECIO Y VISIBILIDAD ---
        ctx.fillStyle = '#EAB308'; 
        ctx.font = '900 130px Rajdhani';
        
        // 1. Sombra fuerte para el precio (para que resalte)
        ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
        ctx.shadowBlur = 8;
        ctx.shadowOffsetX = 4;
        ctx.shadowOffsetY = 4;

        // 2. Dibujamos el número
        const precioStr = `$${p.precio}`;
        ctx.fillText(precioStr, w/2, 850);
        
        // 3. Medimos el ancho REAL del número
        const anchoPrecio = ctx.measureText(precioStr).width;

        // 4. USD Pequeño con Sombra para que se vea sobre blanco
        ctx.font = '700 40px Rajdhani'; 
        ctx.fillStyle = '#fff';
        // Fórmula: Centro + Mitad del ancho del precio + un margen
        ctx.fillText("USD", (w/2) + (anchoPrecio / 2) + 20, 850);

        // RESETEAR SOMBRA (Importante para que no afecte al footer)
        ctx.shadowColor = "transparent";
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;

        // Footer
        ctx.fillStyle = '#1e40af'; ctx.fillRect(0, 930, w, 150);
        ctx.fillStyle = '#ffffff'; ctx.font = '700 45px Rajdhani';
        ctx.fillText("📦 ENVÍO RÁPIDO A TODA LA HABANA", w/2, 990);
        ctx.fillStyle = '#fbbf24'; ctx.font = '900 55px Rajdhani';
        ctx.fillText(`📞 PEDIDOS: +53 ${AGENT_PHONE}`, w/2, 1055);

        return canvas.toDataURL('image/jpeg', 0.9);
    }

    async function generateAdCopy(p) {
        // Copia simple si falla la IA o para ahorrar tokens en batch grande
        return `🔥 ¡OFERTA DISPONIBLE!\n📦 Modelo: *${p.nombre}*\n💰 Precio: *$${p.precio} USD*\n💎 Garantía y Entrega Rápida.\n🚀 ¡Escribe antes que se agote!`;
    }

    // --- UTILIDADES ---
    function fixDriveUrl(url) {
        if (!url || url === 'null' || url === 'undefined' || url.trim() === '') return 'https://placehold.co/400x400/1a4789/ffffff?text=Sin+Foto';
        let nombreArchivo = url;
        if (url.includes('/')) nombreArchivo = url.split('/').pop();
        nombreArchivo = nombreArchivo.split('?')[0];
        try { nombreArchivo = decodeURIComponent(nombreArchivo); } catch(e) {}
        nombreArchivo = nombreArchivo.trim().replace(/['"]/g, '').replace(/\s+/g, '');
        const GITHUB_USER = 'paratuhogar'; const REPO = 'paratuhogar-fotos'; const BRANCH = 'main'; 
        return `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO}/${BRANCH}/img_productos/${nombreArchivo}`;
    }

    async function getOrGenerateShortLink(productName) {
        const cleanName = encodeURIComponent(productName.trim());
        const longLink = `${BASE_WEB_URL}/index.html?search=${cleanName}&gestor=${encodeURIComponent(AGENT_NAME)}&tel=${AGENT_PHONE}`;
        try {
            const { data } = await supabaseClient.from('short_links').select('slug').eq('original_url', longLink).maybeSingle();
            if (data && data.slug) return `${BASE_WEB_URL}/index.html?s=${data.slug}`;
            
            const newSlug = Math.random().toString(36).substring(2, 7);
            const { error } = await supabaseClient.from('short_links').insert([{ slug: newSlug, original_url: longLink, gestor: AGENT_NAME }]);
            if (!error) return `${BASE_WEB_URL}/index.html?s=${newSlug}`;
        } catch (e) {}
        return longLink;
    }

    function copyToClipboard(id, btn) {
        const el = document.getElementById(id);
        el.select();
        document.execCommand('copy');
        const original = btn.innerText;
        btn.innerText = "¡COPIADO!";
        btn.classList.add("bg-green-600", "text-white", "border-green-600");
        setTimeout(() => { 
            btn.innerText = original; 
            btn.classList.remove("bg-green-600", "text-white", "border-green-600");
        }, 2000);
    }

    function downloadImageById(id, name) {
        const img = document.getElementById(`img-result-${id}`);
        if(img) {
            const a = document.createElement('a');
            a.href = img.src;
            a.download = `Post_${name.replace(/\s+/g, '_')}.jpg`;
            a.click();
        }
    }
