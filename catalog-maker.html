<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio de Catálogos | ParaTuHogar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: Manrope, sans-serif; }
        .paper { box-shadow: 0 25px 70px -20px rgba(15, 23, 42, .35); }
        @keyframes shimmer { to { transform: translateX(100%); } }
    </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
    <header class="sticky top-0 z-40 bg-[#102b53] text-white shadow-xl">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 md:px-8">
            <div class="flex items-center gap-3">
                <div class="grid h-10 w-10 place-items-center rounded-xl bg-white/10">
                    <span class="material-symbols-outlined">auto_awesome</span>
                </div>
                <div>
                    <h1 class="text-base font-black uppercase tracking-tight">Estudio de Catálogos</h1>
                    <p class="text-[10px] font-bold uppercase tracking-[.18em] text-blue-200">ParaTuHogar · PDF profesional</p>
                </div>
            </div>
            <button onclick="window.close()" class="rounded-lg bg-white/10 px-3 py-2 text-xs font-bold hover:bg-white/20">Cerrar</button>
        </div>
    </header>

    <main class="mx-auto grid max-w-7xl gap-7 p-4 md:p-8 lg:grid-cols-[360px_1fr]">
        <section class="space-y-5">
            <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
                <div class="mb-4 flex items-center justify-between">
                    <span class="rounded-full bg-blue-50 px-3 py-1 text-[9px] font-black uppercase tracking-wider text-blue-700">Datos listos</span>
                    <span id="date-tag" class="text-[10px] font-bold text-slate-400"></span>
                </div>
                <h2 id="cat-title" class="text-2xl font-black leading-tight text-[#102b53]">Catálogo</h2>
                <p id="cat-count" class="mt-1 text-xs font-bold text-slate-500">Cargando...</p>
                <div class="mt-5 flex items-center gap-3 rounded-2xl bg-slate-50 p-3">
                    <div class="grid h-10 w-10 place-items-center rounded-full bg-white text-[#1a4789] shadow-sm">
                        <span class="material-symbols-outlined">person</span>
                    </div>
                    <div class="min-w-0">
                        <p class="text-[9px] font-black uppercase tracking-wider text-slate-400">Asesor responsable</p>
                        <p id="agent-name" class="truncate text-sm font-extrabold text-slate-800"></p>
                    </div>
                </div>
            </div>

            <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
                <p class="mb-4 text-[10px] font-black uppercase tracking-[.18em] text-slate-400">Formato</p>
                <label class="mb-3 flex cursor-pointer gap-3 rounded-2xl border p-4 has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50">
                    <input type="radio" name="style" value="pro" checked class="mt-1">
                    <div>
                        <p class="text-sm font-black">Catálogo comercial PRO</p>
                        <p class="mt-1 text-[11px] leading-relaxed text-slate-500">Portada, fichas visuales, precio destacado, información útil y contacto directo.</p>
                    </div>
                </label>
                <label class="flex cursor-pointer gap-3 rounded-2xl border p-4 has-[:checked]:border-slate-500 has-[:checked]:bg-slate-50">
                    <input type="radio" name="style" value="basic" class="mt-1">
                    <div>
                        <p class="text-sm font-black">Lista de precios</p>
                        <p class="mt-1 text-[11px] leading-relaxed text-slate-500">Versión compacta para imprimir o consultar inventario rápidamente.</p>
                    </div>
                </label>
            </div>

            <div class="rounded-3xl border border-blue-100 bg-gradient-to-b from-blue-50 to-white p-6 shadow-sm">
                <p class="mb-4 text-[10px] font-black uppercase tracking-[.18em] text-blue-500">Contenido</p>
                <div class="space-y-3 text-xs font-bold text-slate-700">
                    <label class="flex items-center justify-between"><span>Portada premium</span><input id="opt-cover" type="checkbox" checked></label>
                    <label class="flex items-center justify-between"><span>QR general de contacto</span><input id="opt-qr" type="checkbox" checked></label>
                    <label class="flex items-center justify-between"><span>Garantía y entrega</span><input id="opt-details" type="checkbox" checked></label>
                </div>
            </div>

            <button id="btn-generate" onclick="startGeneration()" class="relative flex w-full items-center justify-center gap-3 overflow-hidden rounded-2xl bg-[#1a4789] py-4 text-xs font-black uppercase tracking-[.15em] text-white shadow-xl shadow-blue-900/20 hover:bg-[#2461a5]">
                <span class="material-symbols-outlined">download</span>
                <span>Descargar PDF</span>
            </button>
            <div id="progress-container" class="hidden">
                <div class="mb-2 flex justify-between text-[10px] font-bold text-slate-500">
                    <span id="status-text">Preparando...</span><span id="progress-percent">0%</span>
                </div>
                <div class="h-2 overflow-hidden rounded-full bg-slate-200"><div id="progress-bar" class="h-full w-0 bg-emerald-500 transition-all"></div></div>
            </div>
        </section>

        <section class="relative min-h-[620px] overflow-hidden rounded-[2rem] border border-slate-200 bg-slate-200 p-6 md:p-10">
            <div class="absolute inset-0 opacity-30" style="background-image:radial-gradient(#94a3b8 1px,transparent 1px);background-size:22px 22px"></div>
            <div class="paper relative mx-auto flex aspect-[1/1.414] w-full max-w-[480px] flex-col overflow-hidden bg-white">
                <div class="h-2 bg-gradient-to-r from-[#102b53] via-[#2475b9] to-[#27b3a2]"></div>
                <div class="flex flex-1 flex-col justify-between p-9">
                    <div>
                        <p class="text-[9px] font-black uppercase tracking-[.28em] text-blue-600">Selección comercial</p>
                        <h3 id="preview-title" class="mt-3 text-4xl font-black uppercase leading-none text-[#102b53]">Catálogo</h3>
                        <div class="mt-5 h-1 w-16 rounded bg-emerald-400"></div>
                    </div>
                    <div class="rounded-3xl bg-[#102b53] p-6 text-white">
                        <p class="text-[9px] font-black uppercase tracking-[.2em] text-blue-200">Tu asesor</p>
                        <p id="preview-agent" class="mt-2 text-xl font-black">ParaTuHogar</p>
                        <p class="mt-1 text-xs text-blue-100">Precios claros · Compra asistida · Atención directa</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="qr-stage" class="fixed -left-[9999px] -top-[9999px]"></div>

<script>
let payload;
const { jsPDF } = window.jspdf;
const C = { navy:[16,43,83], blue:[26,71,137], teal:[39,179,162], ink:[24,38,58], muted:[91,106,125], pale:[244,247,250], line:[222,229,236] };

window.addEventListener('load', () => {
    try {
        payload = JSON.parse(localStorage.getItem('pth_catalog_data') || 'null');
        if (!payload || !Array.isArray(payload.products)) throw new Error('No hay productos cargados.');
        const cat = payload.categoryName === 'TODOS' ? 'Selección general' : (payload.categoryName || 'Catálogo');
        document.getElementById('cat-title').textContent = cat;
        document.getElementById('preview-title').textContent = cat;
        document.getElementById('cat-count').textContent = `${payload.products.length} productos disponibles`;
        document.getElementById('agent-name').textContent = payload.agent || 'Asesor de ventas';
        document.getElementById('preview-agent').textContent = payload.agent || 'Asesor de ventas';
        document.getElementById('date-tag').textContent = new Date(payload.timestamp || Date.now()).toLocaleDateString('es-ES');
    } catch (error) {
        alert(error.message);
        document.getElementById('btn-generate').disabled = true;
    }
});

function cleanText(value) {
    const box = document.createElement('div');
    box.innerHTML = String(value || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/p>/gi, '\n');
    return (box.textContent || '').replace(/[•●▪]/g, '-').replace(/\s*\n\s*/g, '\n').replace(/[ \t]+/g, ' ').trim();
}

function money(value) {
    const n = Number(String(value || 0).replace(/[^\d.]/g, '')) || 0;
    return n.toLocaleString('en-US', { maximumFractionDigits: 2 });
}

function productImageUrl(raw) {
    if (!raw) return '';
    const value = String(raw).trim().replace(/['"]/g, '');
    if (/^https?:\/\//i.test(value) && !value.includes('drive.google.com')) return value;
    const name = value.split('/').pop().split('?')[0].trim();
    return `https://raw.githubusercontent.com/paratuhogar/paratuhogar-fotos/main/img_productos/${encodeURIComponent(name)}`;
}

function loadImage(url) {
    return new Promise(resolve => {
        if (!url) return resolve(null);
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
            const max = 760;
            const scale = Math.min(1, max / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve({ data: canvas.toDataURL('image/jpeg', .86), ratio: canvas.width / canvas.height });
        };
        img.onerror = () => resolve(null);
        img.src = url;
    });
}

function makeQrData(text) {
    return new Promise(resolve => {
        const stage = document.getElementById('qr-stage');
        stage.innerHTML = '';
        new QRCode(stage, { text, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
        setTimeout(() => {
            const canvas = stage.querySelector('canvas');
            const image = stage.querySelector('img');
            resolve(canvas ? canvas.toDataURL('image/png') : (image ? image.src : null));
        }, 80);
    });
}

function contactLink(productName = '') {
    const digits = String(payload.phone || '').replace(/\D/g, '');
    const message = productName
        ? `Hola ${payload.agent}, me interesa ${productName}. ¿Está disponible?`
        : `Hola ${payload.agent}, vi tu catálogo de ParaTuHogar y quiero recibir asesoría.`;
    return `https://wa.me/${digits}?text=${encodeURIComponent(message)}`;
}

function addContainedImage(doc, img, x, y, w, h) {
    if (!img) return false;
    let dw = w, dh = w / img.ratio;
    if (dh > h) { dh = h; dw = h * img.ratio; }
    doc.addImage(img.data, 'JPEG', x + (w - dw) / 2, y + (h - dh) / 2, dw, dh, undefined, 'FAST');
    return true;
}

function drawLogo(doc, x, y, dark = false) {
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(12);
    doc.setTextColor(...(dark ? C.navy : [255,255,255]));
    doc.text('PARA', x, y);
    const w = doc.getTextWidth('PARA');
    doc.setTextColor(...C.teal);
    doc.text('TUHOGAR', x + w + 1, y);
}

async function startGeneration() {
    if (!payload?.products?.length) return;
    const btn = document.getElementById('btn-generate');
    const progress = document.getElementById('progress-container');
    const bar = document.getElementById('progress-bar');
    const pct = document.getElementById('progress-percent');
    const status = document.getElementById('status-text');
    btn.disabled = true;
    btn.classList.add('opacity-60');
    progress.classList.remove('hidden');
    try {
        const prepared = [];
        for (let i = 0; i < payload.products.length; i++) {
            const p = payload.products[i];
            const percent = Math.round(((i + 1) / payload.products.length) * 100);
            bar.style.width = `${percent}%`;
            pct.textContent = `${percent}%`;
            status.textContent = `Optimizando ${String(p.nombre || '').slice(0, 25)}...`;
            prepared.push({ ...p, imgObj: await loadImage(productImageUrl(p.thumbnail)) });
        }
        const doc = new jsPDF({ unit:'mm', format:'a4', compress:true });
        const style = document.querySelector('input[name="style"]:checked').value;
        status.textContent = 'Componiendo catálogo...';
        if (style === 'basic') generateBasic(doc, prepared);
        else await generatePro(doc, prepared);
        const safeCat = String(payload.categoryName || 'Catalogo').replace(/[^a-z0-9]+/gi, '_');
        const safeAgent = String(payload.agent || 'Asesor').replace(/[^a-z0-9]+/gi, '_');
        doc.save(`Catalogo_${safeCat}_${safeAgent}.pdf`);
        status.textContent = 'Catálogo descargado';
    } catch (error) {
        console.error(error);
        alert(`No se pudo generar el catálogo: ${error.message}`);
    } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-60');
    }
}

async function generatePro(doc, products) {
    const useCover = document.getElementById('opt-cover').checked;
    const useQr = document.getElementById('opt-qr').checked;
    const useDetails = document.getElementById('opt-details').checked;
    const generalQr = useQr ? await makeQrData(contactLink()) : null;
    const category = payload.categoryName === 'TODOS' ? 'SELECCIÓN GENERAL' : String(payload.categoryName || 'CATÁLOGO').toUpperCase();

    if (useCover) {
        doc.setFillColor(...C.navy); doc.rect(0,0,210,297,'F');
        doc.setFillColor(22,60,112); doc.circle(205,40,74,'F');
        doc.setFillColor(...C.teal); doc.circle(18,280,58,'F');
        drawLogo(doc, 18, 25);
        doc.setTextColor(152,190,229); doc.setFontSize(9); doc.setFont('helvetica','bold');
        doc.text('CATÁLOGO COMERCIAL · EDICIÓN DIGITAL',18,58);
        doc.setTextColor(255,255,255); doc.setFontSize(36);
        const titleLines = doc.splitTextToSize(category, 170).slice(0,3);
        doc.text(titleLines,18,78);
        const titleEnd = 78 + titleLines.length * 14;
        doc.setFillColor(...C.teal); doc.roundedRect(18,titleEnd + 8,35,3,1.5,1.5,'F');
        doc.setTextColor(202,219,239); doc.setFontSize(11); doc.setFont('helvetica','normal');
        doc.text('Equipos seleccionados para comprar mejor.',18,titleEnd + 22);
        doc.text('Precios transparentes y atención personalizada.',18,titleEnd + 29);
        doc.setFillColor(255,255,255); doc.roundedRect(18,210,174,56,5,5,'F');
        doc.setTextColor(...C.muted); doc.setFontSize(8); doc.setFont('helvetica','bold');
        doc.text('ASESOR COMERCIAL',30,226);
        doc.setTextColor(...C.navy); doc.setFontSize(17);
        doc.text(String(payload.agent || 'Asesor de ventas').toUpperCase(),30,237);
        doc.setFontSize(10); doc.setTextColor(...C.blue);
        doc.text(`WhatsApp +${String(payload.phone || '').replace(/^\+/, '')}`,30,247);
        doc.setTextColor(...C.muted); doc.setFontSize(8); doc.setFont('helvetica','normal');
        doc.text(`${products.length} productos disponibles · Precios en USD`,30,257);
        if (generalQr) {
            doc.addImage(generalQr,'PNG',154,218,30,30);
            doc.setTextColor(...C.muted); doc.setFontSize(6); doc.setFont('helvetica','bold');
            doc.text('ESCANEA Y ESCRÍBEME',169,253,{align:'center'});
        }
        doc.addPage();
    }

    const drawPageFrame = () => {
        doc.setFillColor(...C.navy); doc.rect(0,0,210,17,'F');
        drawLogo(doc,14,11.5);
        doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(191,213,235);
        doc.text(category,196,11.5,{align:'right'});
        doc.setDrawColor(...C.line); doc.line(14,282,196,282);
        doc.setTextColor(...C.muted); doc.setFontSize(7); doc.setFont('helvetica','normal');
        doc.text(`Atendido por ${payload.agent} · WhatsApp +${String(payload.phone || '').replace(/^\+/, '')}`,14,288);
    };

    drawPageFrame();
    const cardW = 88, cardH = 122, gapX = 6, gapY = 8, startX = 14, startY = 24;
    for (let i = 0; i < products.length; i++) {
        const slot = i % 4;
        if (i > 0 && slot === 0) { doc.addPage(); drawPageFrame(); }
        const col = slot % 2, row = Math.floor(slot / 2);
        const x = startX + col * (cardW + gapX), y = startY + row * (cardH + gapY);
        drawProductCard(doc, products[i], x, y, cardW, cardH, useDetails);
    }
    if (products.length % 4 === 1) {
        drawAdvisorCard(doc, startX + cardW + gapX, startY, cardW, cardH, generalQr);
    }

    const pages = doc.internal.getNumberOfPages();
    for (let p = 1; p <= pages; p++) {
        doc.setPage(p); doc.setFontSize(7); doc.setTextColor(...C.muted);
        doc.text(`${p} / ${pages}`,196,288,{align:'right'});
    }
}

function drawAdvisorCard(doc, x, y, w, h, qrData) {
    doc.setFillColor(...C.navy);
    doc.roundedRect(x,y,w,h,3,3,'F');
    doc.setFillColor(24,65,119);
    doc.circle(x+w+5,y+8,34,'F');
    doc.setFillColor(...C.teal);
    doc.roundedRect(x+7,y+9,28,3,1.5,1.5,'F');
    doc.setTextColor(181,207,234);
    doc.setFont('helvetica','bold');
    doc.setFontSize(7);
    doc.text('¿TE AYUDO A ELEGIR?',x+7,y+23);
    doc.setTextColor(255,255,255);
    doc.setFontSize(17);
    doc.text(['COMPRA CON','ASESORÍA DIRECTA'],x+7,y+36);
    doc.setFont('helvetica','normal');
    doc.setFontSize(8);
    doc.setTextColor(205,222,240);
    const copy = doc.splitTextToSize('Confirma disponibilidad, entrega y garantía antes de comprar.',w-14);
    doc.text(copy,x+7,y+58);
    if (qrData) {
        doc.setFillColor(255,255,255);
        doc.roundedRect(x+7,y+73,36,36,2,2,'F');
        doc.addImage(qrData,'PNG',x+10,y+76,30,30);
        doc.setFont('helvetica','bold');
        doc.setFontSize(6);
        doc.setTextColor(255,255,255);
        doc.text('ESCANEA PARA ESCRIBIR',x+48,y+83);
    }
    doc.setFont('helvetica','bold');
    doc.setFontSize(9);
    doc.setTextColor(255,255,255);
    doc.text(String(payload.agent || 'Asesor de ventas').toUpperCase(),x+48,y+94,{maxWidth:w-55});
    doc.setFontSize(7);
    doc.setTextColor(...C.teal);
    doc.text(`+${String(payload.phone || '').replace(/^\+/, '')}`,x+48,y+104);
    doc.link(x,y,w,h,{url:contactLink()});
}

function drawProductCard(doc, p, x, y, w, h, useDetails) {
    doc.setFillColor(255,255,255); doc.setDrawColor(...C.line); doc.roundedRect(x,y,w,h,3,3,'FD');
    doc.setFillColor(...C.pale); doc.roundedRect(x+1,y+1,w-2,50,2,2,'F');
    if (!addContainedImage(doc,p.imgObj,x+6,y+5,w-12,42)) {
        doc.setDrawColor(207,216,226); doc.setLineWidth(.6);
        doc.circle(x+w/2,y+22,10); doc.line(x+w/2-6,y+28,x+w/2+6,y+16);
        doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(148,163,184);
        doc.text('IMAGEN NO DISPONIBLE',x+w/2,y+39,{align:'center'});
    }
    doc.setFillColor(...C.teal); doc.roundedRect(x+6,y+47,24,6,3,3,'F');
    doc.setTextColor(255,255,255); doc.setFontSize(6); doc.setFont('helvetica','bold');
    doc.text('DISPONIBLE',x+18,y+51.2,{align:'center'});

    doc.setTextColor(...C.ink); doc.setFontSize(9.3); doc.setFont('helvetica','bold');
    let name = doc.splitTextToSize(cleanText(p.nombre).toUpperCase(),w-12);
    if (name.length > 2) name = [name[0], `${name[1].slice(0,-2)}...`];
    doc.text(name,x+6,y+61);

    doc.setTextColor(...C.blue); doc.setFontSize(18); doc.setFont('helvetica','bold');
    const price = `$${money(p.precio)}`;
    doc.text(price,x+6,y+77);
    const priceW = doc.getTextWidth(price);
    doc.setFontSize(7); doc.text('USD',x+7+priceW,y+77);

    let infoY = y + 85;
    if (useDetails) {
        const facts = [];
        const warranty = cleanText(p.garantia);
        const delivery = cleanText(p.mensajeria);
        if (warranty) facts.push(`Garantía: ${warranty}`);
        if (delivery) facts.push(`Entrega: ${delivery}`);
        const desc = cleanText(p.descripcion).split('\n').filter(Boolean).slice(0,2).join(' · ');
        if (desc) facts.push(desc);
        doc.setTextColor(...C.muted); doc.setFont('helvetica','normal'); doc.setFontSize(6.8);
        let lines = doc.splitTextToSize(facts.join('\n'),w-12).slice(0,4);
        doc.text(lines,x+6,infoY);
    }

    const btnY = y+h-15;
    doc.setFillColor(...C.navy); doc.roundedRect(x+6,btnY,w-12,9,2,2,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
    doc.text('CONSULTAR POR WHATSAPP',x+w/2,btnY+5.8,{align:'center'});
    doc.link(x+6,btnY,w-12,9,{url:contactLink(p.nombre)});
}

function generateBasic(doc, products) {
    doc.setFillColor(...C.navy); doc.rect(0,0,210,35,'F');
    drawLogo(doc,14,14);
    doc.setTextColor(255,255,255); doc.setFontSize(18); doc.setFont('helvetica','bold');
    doc.text('LISTA DE PRECIOS',14,27);
    doc.setFontSize(8); doc.setTextColor(194,215,238);
    doc.text(`${payload.agent} · WhatsApp +${String(payload.phone || '').replace(/^\+/, '')}`,196,27,{align:'right'});
    const body = products.map(p => [
        cleanText(p.nombre),
        String(p.categoria || ''),
        `$${money(p.precio)}`,
        cleanText(p.garantia) || 'Consultar'
    ]);
    doc.autoTable({
        startY:42,
        head:[['Producto','Categoría','Precio USD','Garantía']],
        body,
        margin:{left:14,right:14,bottom:18},
        theme:'plain',
        headStyles:{fillColor:C.blue,textColor:255,fontStyle:'bold',fontSize:8,cellPadding:3},
        bodyStyles:{textColor:C.ink,fontSize:8,cellPadding:3},
        alternateRowStyles:{fillColor:C.pale},
        columnStyles:{0:{cellWidth:85},1:{cellWidth:35},2:{cellWidth:25,fontStyle:'bold',textColor:C.blue},3:{cellWidth:37}},
        didDrawPage: data => {
            doc.setDrawColor(...C.line); doc.line(14,284,196,284);
            doc.setFontSize(7); doc.setTextColor(...C.muted);
