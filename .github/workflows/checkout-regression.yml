name: Pedidos - regresión de envío

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkout-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkout-recovery:
    name: checkout-recovery
    # Playwright 1.57.0 supports Ubuntu 24.04; latest may select Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar navegador de pruebas aislado
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --prefix "$RUNNER_TEMP/pth-checkout" --no-save --ignore-scripts playwright@1.57.0 @electric-sql/pglite@0.5.12
          "$RUNNER_TEMP/pth-checkout/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pth-checkout/node_modules" >> "$GITHUB_ENV"
          PTH_TEST_CHROME=$(NODE_PATH="$RUNNER_TEMP/pth-checkout/node_modules" node -p 'require("playwright").chromium.executablePath()')
          echo "PTH_CHROMIUM=$PTH_TEST_CHROME" >> "$GITHUB_ENV"
          echo "PTH_PGLITE_MODULE=$RUNNER_TEMP/pth-checkout/node_modules/@electric-sql/pglite/dist/index.js" >> "$GITHUB_ENV"
      - name: Verificar numeración transaccional con PostgreSQL aislado
        run: |
          node scripts/verify-atomic-order-numbering-sql.mjs
          node scripts/verify-checkout-server-clock-sql.mjs
          node scripts/verify-subgestor-review-sql.mjs
      - name: Verificar envío, recibos y recuperación de pedidos
        run: |
          npm run check:checkout-release
          PTH_EXPRESS_SHIPPING=1 node tests/checkout-recovery-latest-browser.cjs
          node tests/tariff-editor-browser.cjs
