<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio Pro | paratuhogar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    
    <style>
        body { font-family: 'Manrope', sans-serif; background-color: #020617; color: white; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .loader { border: 3px solid #1e293b; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">

    <div class="w-full max-w-5xl glass rounded-3xl p-6 md:p-10 shadow-2xl relative overflow-hidden border border-blue-500/20">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-3 rounded-xl shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                    <span class="material-symbols-outlined text-2xl text-white">smart_toy</span>
                </div>
                <div>
                    <h1 class="text-2xl font-black uppercase tracking-widest text-blue-400">Marketing AI <span class="text-white">Pro</span></h1>
                    <p class="text-xs text-slate-400 font-mono" id="agent-display">Conectando...</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <!-- BOTÓN PARA CAMBIAR API KEY -->
                <button onclick="resetApiKey()" class="flex items-center gap-1 p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold text-slate-300 transition-colors border border-slate-700" title="Cambiar Clave de Gemini">
                    <span class="material-symbols-outlined text-sm">key</span> Reset API
                </button>
                <button onclick="window.close()" class="p-2 hover:bg-red-500/20 text-slate-400 hover:text-red-400 rounded-full transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Panel Izquierdo: Configuración -->
            <div class="space-y-6 lg:col-span-4">
                
                <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3 border-b border-slate-800 pb-2">Equipos en Memoria</p>
                    <div id="product-list" class="text-xs font-bold text-slate-300 max-h-48 overflow-y-auto space-y-2 custom-scrollbar">
                        <!-- Se llena con JS -->
                    </div>
                </div>

                <!-- API Key Box -->
                <div id="api-key-box" class="hidden bg-blue-900/20 p-4 rounded-2xl border border-blue-500/30">
                    <label class="text-[10px] font-black text-blue-400 uppercase mb-2 block tracking-widest">Google Gemini API Key</label>
                    <input type="password" id="api-key-input" placeholder="Pega tu API Key aquí..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:border-blue-500 focus:outline-none">
                </div>

                <button onclick="generatePost()" id="btn-generate" class="w-full py-4 bg-blue-600 hover:bg-blue-500 rounded-xl font-black uppercase tracking-widest shadow-[0_0_20px_rgba(59,130,246,0.3)] transition-all flex items-center justify-center gap-2 active:scale-95">
                    <span class="material-symbols-outlined">auto_fix</span> Redactar Post
                </button>
            </div>

            <!-- Panel Derecho: Resultado -->
            <div class="relative lg:col-span-8">
                <div class="absolute top-4 right-4 z-10 flex gap-2">
                    <button onclick="copyResult()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-xs font-black uppercase tracking-widest flex items-center gap-2 shadow-lg transition-colors">
                        <span class="material-symbols-outlined text-sm">content_copy</span> Copiar
                    </button>
                </div>
                <textarea id="result-area" class="w-full h-full min-h-[500px] bg-[#0f172a] border-2 border-slate-700 rounded-2xl p-6 pt-16 text-sm leading-relaxed text-slate-200 focus:outline-none focus:border-blue-500 font-sans resize-none shadow-inner" placeholder="Presiona 'Redactar Post' y la IA escribirá un texto corporativo perfecto para Facebook aquí..."></textarea>
            </div>
        </div>
    </div>

    <script>
        let payload = null;

        window.onload = function() {
            const data = localStorage.getItem('pth_marketing_payload');
            if(!data) return alert("No hay datos de productos. Vuelve al catálogo y selecciona productos.");
            
            payload = JSON.parse(data);

            // --- SEGURIDAD (MODO DIOS) ---
            if (payload.agent !== "Marcel Montano") {
                document.body.innerHTML = `<div style="height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#020617; color:#ef4444; font-family:sans-serif; text-align:center;">
                    <span style="font-size:4rem;">🚫</span><h1 style="font-size:2rem; font-weight:900;">ACCESO DENEGADO</h1>
                    <p style="color:#64748b;">Usuario no autorizado.</p></div>`;
                return; 
            }

            document.getElementById('agent-display').innerText = `Gestor: ${payload.agent.toUpperCase()}`;

            // Renderizar lista
            const list = document.getElementById('product-list');
            list.innerHTML = payload.products.map(p => `
                <div class="flex justify-between border-b border-slate-800 pb-1">
                    <span class="truncate w-3/4 text-slate-300 pr-2">${p.name}</span>
                    <span class="text-blue-400">$${p.price}</span>
                </div>
            `).join('');

            // Verificar API Key
            if(!localStorage.getItem('pth_gemini_api_key')) {
                document.getElementById('api-key-box').classList.remove('hidden');
            }
        };

        function resetApiKey() {
            localStorage.removeItem('pth_gemini_api_key');
            document.getElementById('api-key-box').classList.remove('hidden');
            document.getElementById('api-key-input').value = "";
            document.getElementById('api-key-input').focus();
        }

        async function generatePost() {
            const inputKey = document.getElementById('api-key-input').value;
            if(inputKey) {
                localStorage.setItem('pth_gemini_api_key', inputKey);
                document.getElementById('api-key-box').classList.add('hidden');
            }

            const apiKey = localStorage.getItem('pth_gemini_api_key');
            if(!apiKey) {
                document.getElementById('api-key-box').classList.remove('hidden');
                return alert("⚠️ Ingresa tu API Key de Google Gemini para continuar.");
            }

            const btn = document.getElementById('btn-generate');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<div class="loader"></div> Redactando...`;
            btn.disabled = true;

            try {
                // Obtener teléfono del payload (si existe), si no, usar el tuyo por defecto
                let phoneRaw = payload.phone || "5358183649"; 
                let cleanPhone = phoneRaw.replace(/\D/g, '');
                if(cleanPhone.length === 8) cleanPhone = '53' + cleanPhone;
                const waLink = `https://wa.me/${cleanPhone}`;

                // Preparar texto de productos
                const productText = payload.products.map(p => `
                PRODUCTO: ${p.name}
                PRECIO: $${p.price} USD
                ENLACE DIRECTO: ${p.link}
                `).join('\n\n');

                const prompt = `
Actúa como un Ejecutivo de Ventas Corporativo y Community Manager Senior para la empresa "ParaTuHogar" en Cuba.
Tu objetivo es redactar un post para Facebook que venda los siguientes productos.

DATOS A PUBLICAR:
${productText}

REGLAS ESTRICTAS DE FORMATO Y TONO (OBLIGATORIAS):
1. CERO ASTERISCOS: NO uses NUNCA asteriscos (*) ni guiones bajos (_) para hacer negritas. Escribe texto normal y usa MAYÚSCULAS únicamente para resaltar el nombre del producto o palabras clave como OFERTA.
2. TONO: Serio, corporativo, directo y transparente. Transmite confianza absoluta. No uses chistes ni jerga callejera.
3. EMOJIS: Usa un máximo de 4 o 5 emojis en todo el texto. Deben ser profesionales (ej: ✅, 🚚, 🛡️, 📄, 📲).
4. ESTRUCTURA OBLIGATORIA:
   - Título atractivo y profesional en mayúsculas.
   - Breve introducción sobre equipar el hogar con calidad.
   - Lista de los productos. Por cada producto debes poner: Su nombre en mayúsculas, el precio y justo debajo su ENLACE DIRECTO.
   - Párrafo de Garantías (Mencionar explícitamente: Factura oficial de compra y Garantía certificada).
   - Párrafo de Envío (Mencionar explícitamente: "Servicio de mensajería disponible en 24 horas con costo adicional según su municipio").
   - Call to Action: Cierra indicando que pueden contactarte directamente al WhatsApp: ${waLink}

Escribe el post listo para copiar y pegar en Facebook. RECUERDA: PROHIBIDO USAR ASTERISCOS.
                `;

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                
                if(data.error) {
                    if (data.error.code === 400 || data.error.code === 403) {
                        resetApiKey();
                        throw new Error("API Key inválida o caducada. Ingresa una nueva.");
                    }
                    throw new Error(data.error.message);
                }

                let generatedText = data.candidates[0].content.parts[0].text;
                
                // 🛡️ LIMPIEZA FORZOSA: Eliminamos asteriscos por si la IA se equivoca
                generatedText = generatedText.replace(/\*/g, '');

                // Efecto de escritura
                const textArea = document.getElementById('result-area');
                textArea.value = "";
                let i = 0;
                const typeWriter = setInterval(() => {
                    if (i < generatedText.length) {
                        textArea.value += generatedText.charAt(i);
                        i++;
                        textArea.scrollTop = textArea.scrollHeight;
                    } else {
                        clearInterval(typeWriter);
                    }
                }, 3); 

            } catch (e) {
                alert("❌ Error: " + e.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function copyResult() {
            const copyText = document.getElementById("result-area");
            copyText.select();
            document.execCommand("copy");
            alert("✅ ¡Copiado con éxito! Listo para pegar en Facebook.");
        }
    </script>
</body>
</html>
