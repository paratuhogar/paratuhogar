<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1a4789">
  <title>Sin conexión | ParaTuHogar</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f1f5f9;color:#0f172a;font-family:Arial,sans-serif}.card{width:min(100%,420px);padding:32px;border:1px solid #dbe5f1;border-radius:28px;background:#fff;text-align:center;box-shadow:0 20px 50px rgba(15,23,42,.08)}img{width:88px;height:88px;border-radius:22px;object-fit:cover}h1{margin:22px 0 10px;font-size:26px}p{margin:0;color:#64748b;line-height:1.55}.actions{display:grid;gap:10px;margin-top:24px}button,a{display:block;width:100%;padding:14px;border:0;border-radius:14px;font-size:14px;font-weight:800;text-decoration:none;cursor:pointer}button{background:#1a4789;color:#fff}a{background:#eef4fb;color:#1a4789}
  </style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="ParaTuHogar">
    <h1>Ahora mismo no hay conexión</h1>
    <p>Cuando regresen los datos móviles, pulsa el botón para volver al catálogo actualizado.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Intentar nuevamente</button>
      <a href="/">Volver al inicio</a>
    </div>
  </main>
</body>
</html>
